name: Profile stats

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # GH_TOKEN must be a PAT with `repo` + `read:org` so private and org
      # contributions are counted. The default GITHUB_TOKEN only sees public data.
      - run: node scripts/build-stats.mjs > /dev/null
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || git commit -m "chore: update profile stats" && git push
